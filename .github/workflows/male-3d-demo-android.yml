name: Build SAOMI Soldier Equipment APK
on:
  push:
    branches: [ "male-3d-demo" ]
    paths:
      - "male-3d-demo-android/**"
      - ".github/workflows/male-3d-demo-android.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Fetch 3D engine and assets
        working-directory: male-3d-demo-android/app/src/main/assets
        run: |
          set -e
          curl -L --fail -o babylon.js https://cdn.jsdelivr.net/npm/babylonjs@8.32.0/babylon.js
          curl -L --fail -o babylonjs.loaders.min.js https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.32.0/babylonjs.loaders.min.js
          curl -L --fail -o Soldier.glb https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb
          curl -L --fail -o backpack.glb https://raw.githubusercontent.com/nucleodeestudosmbdevelopment-ux/nucleodeestudosmb-site/6c5a0a46b6aca872acbad6dce6d2ec8b10138ace/public/models/backpack.glb

          # CC0 KayKit buildings + tree (gltf/bin/texture)
          curl -L --fail -o houseA.gltf https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue/building_home_A_blue.gltf
          curl -L --fail -o building_home_A_blue.bin https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue/building_home_A_blue.bin
          curl -L --fail -o houseB.gltf https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue/building_home_B_blue.gltf
          curl -L --fail -o building_home_B_blue.bin https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue/building_home_B_blue.bin
          curl -L --fail -o hexagons_medieval.png https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/buildings/blue/hexagons_medieval.png

          curl -L --fail -o tree.gltf https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/decoration/nature/tree_single_A.gltf
          curl -L --fail -o tree_single_A.bin https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/decoration/nature/tree_single_A.bin
          curl -L --fail -o hexagons_medieval_nature.png https://raw.githubusercontent.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0/main/addons/kaykit_medieval_hexagon_pack/Assets/gltf/decoration/nature/hexagons_medieval.png

          # Fix relative URIs in downloaded glTF files
          sed -i 's/building_home_A_blue.bin/building_home_A_blue.bin/g; s/hexagons_medieval.png/hexagons_medieval.png/g' houseA.gltf
          sed -i 's/building_home_B_blue.bin/building_home_B_blue.bin/g; s/hexagons_medieval.png/hexagons_medieval.png/g' houseB.gltf
          sed -i 's/tree_single_A.bin/tree_single_A.bin/g; s/hexagons_medieval.png/hexagons_medieval_nature.png/g' tree.gltf

          # CC0 ToyCar
          curl -L --fail -o ToyCar.glb https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/ToyCar/glTF-Binary/ToyCar.glb
          ls -lh Soldier.glb backpack.glb houseA.gltf houseB.gltf tree.gltf ToyCar.glb
      - name: Build APK
        working-directory: male-3d-demo-android
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Saomi-3D-Test-Map-v11-APK
          path: male-3d-demo-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
