name: SAOMI Vercel Token Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saomi-vercel-token-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel deploy credential presence
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN_PRESENT=yes"; else echo "VERCEL_TOKEN_PRESENT=no"; fi
          if [ -n "$VERCEL_ACCESS_TOKEN" ]; then echo "VERCEL_ACCESS_TOKEN_PRESENT=yes"; else echo "VERCEL_ACCESS_TOKEN_PRESENT=no"; fi
