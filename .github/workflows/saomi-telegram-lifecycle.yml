name: SAOMI Telegram Signal Lifecycle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saomi-telegram-lifecycle.yml'
      - '.github/scripts/saomi-telegram-lifecycle.mjs'

concurrency:
  group: saomi-trade-ai-telegram-state
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write

    steps:
      - name: Repo kodunu al
        uses: actions/checkout@v4

      - name: Lifecycle syntax kontrolu
        run: node --check .github/scripts/saomi-telegram-lifecycle.mjs

      - name: Aktif sinyallerde TP ve STOP kontrolu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: node .github/scripts/saomi-telegram-lifecycle.mjs

      - name: Lifecycle state kaydet
        if: always()
        shell: bash
        run: |
          git config user.name "saomi-actions"
          git config user.email "saomi-actions@users.noreply.github.com"
          git add .github/state/saomi-telegram-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram lifecycle state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
