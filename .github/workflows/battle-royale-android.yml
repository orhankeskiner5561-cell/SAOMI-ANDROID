name: Build Battle Royale RC2 APK

on:
  push:
    branches: [ "battle-royale-rc2" ]
    paths:
      - "battle-royale-rc1/**"
      - ".github/workflows/battle-royale-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android command line tools
        shell: bash
        run: |
          set -e
          ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -L -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build RC2 APK
        working-directory: battle-royale-rc1
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload RC2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Saomi-Battle-Royale-RC2-APK
          path: battle-royale-rc1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
