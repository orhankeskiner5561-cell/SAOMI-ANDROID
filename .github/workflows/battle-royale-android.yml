name: Build Battle Royale APK

on:
  push:
    branches: [ "battle-royale-rc1" ]
    paths:
      - "battle-royale-rc1/**"
      - ".github/workflows/battle-royale-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: battle-royale-rc1
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saomi-Battle-Royale-RC1-APK
          path: battle-royale-rc1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
