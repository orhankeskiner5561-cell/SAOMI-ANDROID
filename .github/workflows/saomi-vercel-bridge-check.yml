name: SAOMI Vercel Bridge Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saomi-vercel-bridge-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check deploy credential availability
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_DEPLOY_TOKEN: ${{ secrets.VERCEL_DEPLOY_TOKEN }}
          ZEIT_TOKEN: ${{ secrets.ZEIT_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          yesno(){ if [ -n "$1" ]; then echo yes; else echo no; fi; }
          echo "VERCEL_TOKEN_PRESENT=$(yesno "$VERCEL_TOKEN")"
          echo "VERCEL_ACCESS_TOKEN_PRESENT=$(yesno "$VERCEL_ACCESS_TOKEN")"
          echo "VERCEL_DEPLOY_TOKEN_PRESENT=$(yesno "$VERCEL_DEPLOY_TOKEN")"
          echo "ZEIT_TOKEN_PRESENT=$(yesno "$ZEIT_TOKEN")"
          echo "VERCEL_ORG_ID_PRESENT=$(yesno "$VERCEL_ORG_ID")"
          echo "VERCEL_PROJECT_ID_PRESENT=$(yesno "$VERCEL_PROJECT_ID")"
