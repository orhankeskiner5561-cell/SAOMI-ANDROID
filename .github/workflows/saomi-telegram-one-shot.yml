name: SAOMI Telegram Dedupe Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saomi-telegram-one-shot.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Syntax and dedupe markers
        shell: bash
        run: |
          set -e
          node --check .github/scripts/saomi-telegram-pa-v1.mjs
          grep -q "duplicateReason" .github/scripts/saomi-telegram-pa-v1.mjs
          grep -q "rememberSignal" .github/scripts/saomi-telegram-pa-v1.mjs
          grep -q "structuralFingerprint" .github/scripts/saomi-telegram-pa-v1.mjs
          {
            echo "# SAOMI Telegram Dedupe Check"
            echo
            echo "- UTC: $(date -u +%FT%TZ)"
            echo "- Syntax: PASS"
            echo "- Dedupe markers: PASS"
            echo "- Telegram send: NOT RUN"
          } > SAOMI_TELEGRAM_DEDUPE_CHECK.md

      - name: Commit check report
        shell: bash
        run: |
          git config user.name "saomi-actions"
          git config user.email "saomi-actions@users.noreply.github.com"
          git add SAOMI_TELEGRAM_DEDUPE_CHECK.md
          git commit -m "SAOMI Telegram dedupe check result" || true
          git push
