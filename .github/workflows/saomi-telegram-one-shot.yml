name: SAOMI Binance Endpoint Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saomi-telegram-one-shot.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Probe Binance endpoints
        shell: bash
        run: |
          node <<'NODE' > SAOMI_BINANCE_PROBE_RESULT.md
          const urls=[
            'https://fapi.binance.com/fapi/v1/time',
            'https://fapi1.binance.com/fapi/v1/time',
            'https://fapi2.binance.com/fapi/v1/time',
            'https://fapi3.binance.com/fapi/v1/time',
            'https://fapi4.binance.com/fapi/v1/time',
            'https://www.binance.com/fapi/v1/time',
            'https://data-api.binance.vision/api/v3/time',
            'https://api.binance.com/api/v3/time'
          ];
          console.log('# SAOMI Binance endpoint probe');
          console.log();
          for(const url of urls){
            try{
              const r=await fetch(url,{redirect:'follow'});
              const t=await r.text();
              console.log('- '+url+' => '+r.status+' '+r.statusText+' | '+t.slice(0,180).replace(/\s+/g,' '));
            }catch(e){
              console.log('- '+url+' => ERROR '+e.message);
            }
          }
          NODE

      - name: Commit probe result
        shell: bash
        run: |
          git config user.name "saomi-actions"
          git config user.email "saomi-actions@users.noreply.github.com"
          git add SAOMI_BINANCE_PROBE_RESULT.md
          git commit -m "SAOMI Binance endpoint probe result" || true
          git push
