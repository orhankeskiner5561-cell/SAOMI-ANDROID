name: Build SAOMI 3D Male APK

on:
  push:
    branches: [ "male-3d-demo" ]
    paths:
      - "battle-royale-rc3/**"
      - ".github/workflows/battle-royale-rc3.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - uses: actions/checkout@v4

      - name: Fetch rigged male 3D character
        shell: bash
        run: |
          set -e
          rm -rf /tmp/quaternius
          git clone --depth 1 https://github.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender.git /tmp/quaternius
          SRC="/tmp/quaternius/Universal Base Characters[Standard]/Universal Base Characters[Standard]/Base Characters/Godot - UE"
          DST="battle-royale-rc3/assets/characters"
          mkdir -p "$DST"
          cp "$SRC/Superhero_Male_FullBody.gltf" "$DST/"
          cp "$SRC/Superhero_Male_FullBody.bin" "$DST/"
          cp "$SRC/T_Hair_1_Normal.png" "$DST/T_Hair_1_Normal_png.png"
          cp "$SRC/T_Hair_1_BaseColor.png" "$DST/T_Hair_1_BaseColor.png"
          cp "$SRC/T_Eye_Normal.png" "$DST/T_Eye_Normal_png.png"
          cp "$SRC/T_Eye_Brown.png" "$DST/T_Eye_Brown.png"
          cp "$SRC/T_Superhero_Male_Normal.png" "$DST/T_Superhero_Male_Normal.png"
          cp "$SRC/T_Superhero_Male_Dark.png" "$DST/T_Superhero_Male_Dark.png"
          cp "$SRC/T_Superhero_Male_Roughness.png" "$DST/T_Superhero_Male_Roughness.png"

      - name: Import Godot project
        working-directory: battle-royale-rc3
        run: HOME=/root godot --headless --editor --quit-after 25

      - name: Install Android build template
        working-directory: battle-royale-rc3
        shell: bash
        run: |
          set -e
          TEMPLATE=$(find /root/.local/share/godot/export_templates -name android_source.zip | head -1)
          echo "Using template: $TEMPLATE"
          test -f "$TEMPLATE"
          unzip -q "$TEMPLATE" -d .
          find android -maxdepth 3 -type f | head -40

      - name: Export Android APK
        working-directory: battle-royale-rc3
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          HOME=/root godot --headless --path . --verbose --export-debug "Android" build/Saomi-3D-Male-Demo.apk
          ls -lh build/Saomi-3D-Male-Demo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saomi-3D-Male-Demo-APK
          path: battle-royale-rc3/build/Saomi-3D-Male-Demo.apk
          if-no-files-found: error
