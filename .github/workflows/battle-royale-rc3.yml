name: Build Battle Royale RC3 Godot APK

on:
  push:
    branches: [ "battle-royale-rc3" ]
    paths:
      - "battle-royale-rc3/**"
      - ".github/workflows/battle-royale-rc3.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CC0 rigged male and female 3D characters
        shell: bash
        run: |
          set -e
          rm -rf /tmp/quaternius
          git clone --depth 1 https://github.com/NafisRayan/Animate-Rigged-Humanoid-No-Blender.git /tmp/quaternius
          SRC="/tmp/quaternius/Universal Base Characters[Standard]/Universal Base Characters[Standard]/Base Characters/Godot - UE"
          DST="battle-royale-rc3/assets/characters"
          mkdir -p "$DST"

          cp "$SRC/Superhero_Male_FullBody.gltf" "$DST/"
          cp "$SRC/Superhero_Male_FullBody.bin" "$DST/"
          cp "$SRC/Superhero_Female_FullBody.gltf" "$DST/"
          cp "$SRC/Superhero_Female_FullBody.bin" "$DST/"

          cp "$SRC/T_Hair_1_Normal.png" "$DST/T_Hair_1_Normal_png.png"
          cp "$SRC/T_Hair_1_BaseColor.png" "$DST/T_Hair_1_BaseColor.png"
          cp "$SRC/T_Hair_2_Normal.png" "$DST/T_Hair_2_Normal.png"
          cp "$SRC/T_Hair_2_BaseColor.png" "$DST/T_Hair_2_BaseColor.png"
          cp "$SRC/T_Eye_Normal.png" "$DST/T_Eye_Normal_png.png"
          cp "$SRC/T_Eye_Brown.png" "$DST/T_Eye_Brown.png"
          cp "$SRC/T_Superhero_Male_Normal.png" "$DST/T_Superhero_Male_Normal.png"
          cp "$SRC/T_Superhero_Male_Dark.png" "$DST/T_Superhero_Male_Dark.png"
          cp "$SRC/T_Superhero_Male_Roughness.png" "$DST/T_Superhero_Male_Roughness.png"
          cp "$SRC/T_Superhero_Female_Normal.png" "$DST/T_Superhero_Female_Normal.png"
          cp "$SRC/T_Superhero_Female_Dark_BaseColor.png" "$DST/T_Superhero_Female_Dark_BaseColor.png"
          cp "$SRC/T_Superhero_Female_Roughness.png" "$DST/T_Superhero_Female_Roughness.png"
          cp "/tmp/quaternius/Universal Base Characters[Standard]/Universal Base Characters[Standard]/License_Standard.txt" "$DST/QUATERNIUS_LICENSE.txt"

      - name: Import RC3 Godot project
        working-directory: battle-royale-rc3
        run: godot --headless --editor --quit-after 20

      - name: Export RC3 Android APK
        working-directory: battle-royale-rc3
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/Saomi-Battle-Royale-RC3.apk
          ls -lh build/Saomi-Battle-Royale-RC3.apk

      - name: Upload RC3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Saomi-Battle-Royale-RC3-GODOT-APK
          path: battle-royale-rc3/build/Saomi-Battle-Royale-RC3.apk
          if-no-files-found: error
