name: SAOMI Telegram Server Promote

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saomi-vercel-telegram-promote.yml'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Vercel yetkisini kontrol et ve temiz Telegram sunucusunu production yap
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 2
          fi
          npx --yes vercel@latest promote \
            https://saomi-trade-45dv1fo8z-orhankeskiner5561-cells-projects.vercel.app \
            --yes \
            --scope orhankeskiner5561-cells-projects \
            --token "$VERCEL_TOKEN"
          echo "VERCEL_PROMOTE_DONE"
