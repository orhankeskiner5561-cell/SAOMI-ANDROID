name: SAOMI Telegram Secret Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/saomi-telegram-secret-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Presence only
        env:
          A: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          B: ${{ secrets.TELEGRAM_TOKEN }}
          C: ${{ secrets.BOT_TOKEN }}
          D: ${{ secrets.TG_BOT_TOKEN }}
          E: ${{ secrets.SAOMI_TELEGRAM_BOT_TOKEN }}
          F: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          G: ${{ secrets.TELEGRAM_CHAT_ID }}
          H: ${{ secrets.CHAT_ID }}
          I: ${{ secrets.TG_CHAT_ID }}
          J: ${{ secrets.TELEGRAM_GROUP_ID }}
          K: ${{ secrets.SAOMI_TELEGRAM_CHANNEL_ID }}
        shell: bash
        run: |
          for n in A B C D E F G H I J K; do
            if [ -n "${!n}" ]; then echo "$n=yes"; else echo "$n=no"; fi
          done
