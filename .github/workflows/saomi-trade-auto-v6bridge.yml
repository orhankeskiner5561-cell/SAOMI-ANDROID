name: SAOMI Trade AI Liquidity-Sequence Telegram

on:
  schedule:
    # GitHub Actions minimum guvenli siklik: her 5 dakikada bir.
    # Önce 1W, 1D, 4H, 1H majör yönü belirler; sonra 1m, 5m, 15m, 30m içinde likidite sweep -> BOS/CHoCH -> retest sırasını arar.
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/saomi-telegram-pa-v1.mjs'
      - '.github/workflows/saomi-trade-auto-v6bridge.yml'

concurrency:
  group: saomi-trade-ai-telegram-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Repo kodunu al
        uses: actions/checkout@v4

      - name: Node surumunu goster
        run: node --version

      - name: Liquidity-sequence tarayici syntax kontrolu
        run: node --check .github/scripts/saomi-telegram-pa-v1.mjs

      - name: Majör yön + liquidity sweep-break-retest girişi tara ve Telegram'a gonder
        run: node .github/scripts/saomi-telegram-pa-v1.mjs

      - name: Dedupe state kaydet
        if: always()
        shell: bash
        run: |
          git config user.name "saomi-actions"
          git config user.email "saomi-actions@users.noreply.github.com"
          git add .github/state/saomi-telegram-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram signal state [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
