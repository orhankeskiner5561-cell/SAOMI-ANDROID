name: SAOMI Trade AI PA+Gemini Telegram V1

on:
  schedule:
    # 15m mum kapanisindan yaklasik 2 dk sonra: 15m setup + 1h/4h teyit
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: saomi-trade-ai-telegram-pa-v1
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Repo kodunu al
        uses: actions/checkout@v4

      - name: Node surumunu goster
        run: node --version

      - name: PA+Gemini tarayici syntax kontrolu
        run: node --check .github/scripts/saomi-telegram-pa-v1.mjs

      - name: Binance Futures Price Action tara ve Telegram'a gonder
        run: node .github/scripts/saomi-telegram-pa-v1.mjs