name: Build SAOMI Battle Royale Native M1

on:
  push:
    branches: [ "battle-royale-engine-m1" ]
    paths:
      - "saomi-battle-royale-native/**"
      - ".github/workflows/saomi-native-m1.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.5

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -e
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5-stable_linux.x86_64

          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.5-stable/Godot_v4.5-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.stable"
          cd "$HOME/.local/share/godot/export_templates/4.5.stable"
          unzip -q "$GITHUB_WORKSPACE/templates.tpz"
          mv templates/* .
          test -f android_debug.apk

      - name: Fetch character asset
        working-directory: saomi-battle-royale-native
        shell: bash
        run: |
          set -e
          mkdir -p assets
          curl -L --fail -o assets/Soldier.glb https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/gltf/Soldier.glb
          ls -lh assets/Soldier.glb

      - name: Configure Android SDK and debug keystore
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          JDK="${JAVA_HOME_17_X64:-$JAVA_HOME}"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/shutdown_adb_on_exit = true
          SETTINGS

          cd "$GITHUB_WORKSPACE/saomi-battle-royale-native"
          rm -f debug.keystore
          keytool -genkeypair -v -keystore debug.keystore             -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000             -storepass android -keypass android             -dname "CN=Android Debug,O=SAOMI,C=TR"

      - name: Configure export keystore path
        working-directory: saomi-battle-royale-native
        shell: bash
        run: |
          set -e
          sed -i 's#keystore/debug=""#keystore/debug="'"$GITHUB_WORKSPACE"'/saomi-battle-royale-native/debug.keystore"#' export_presets.cfg
          grep -E 'keystore/debug|architectures/arm64' export_presets.cfg

      - name: Import native project
        working-directory: saomi-battle-royale-native
        shell: bash
        run: |
          "$GITHUB_WORKSPACE/Godot_v4.5-stable_linux.x86_64" --headless --path . --import || true

      - name: Build Android APK
        working-directory: saomi-battle-royale-native
        shell: bash
        run: |
          set -e
          mkdir -p build
          "$GITHUB_WORKSPACE/Godot_v4.5-stable_linux.x86_64"             --headless --verbose --path .             --export-debug "Android Debug"             "$GITHUB_WORKSPACE/saomi-battle-royale-native/build/SAOMI-Battle-Royale-M1.apk"

          test -s build/SAOMI-Battle-Royale-M1.apk
          ls -lh build/SAOMI-Battle-Royale-M1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SAOMI-Battle-Royale-Native-M1-APK
          path: saomi-battle-royale-native/build/SAOMI-Battle-Royale-M1.apk
          if-no-files-found: error

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: saomi-native-m1.3
          name: "ŞAOMİ Battle Royale Native M1.3"
          target_commitish: battle-royale-engine-m1
          prerelease: true
          make_latest: false
          files: saomi-battle-royale-native/build/SAOMI-Battle-Royale-M1.apk
          fail_on_unmatched_files: true
