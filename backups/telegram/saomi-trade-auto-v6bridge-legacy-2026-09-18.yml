name: SAOMI Trade AI 15m Auto Scan

on:
  schedule:
    # 15 dakikalik mum kapandiktan yaklasik 2 dk sonra
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

concurrency:
  group: saomi-trade-ai-auto
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Binance Futures tara ve uygun sinyali Telegram'a gonder
        shell: bash
        run: |
          cat > /tmp/saomi-scan.mjs <<'NODE'
          const BASE = 'https://saomi-trade-ai.vercel.app';
          const FUTURES = 'https://fapi.binance.com';
          const SYMBOLS = ['BTCUSDT','ETHUSDT','XRPUSDT','SOLUSDT','BNBUSDT','DOGEUSDT','ADAUSDT'];
          const TIMEFRAME = '15m';
          const MIN_CONFIDENCE = 80;
          const MIN_RR = 2.5;
          const MAX_SIGNALS = 3;

          function ema(a,n){
            if(!a.length) return [];
            const k=2/(n+1), out=[];
            let x=a[0];
            for(let i=0;i<a.length;i++){
              x=i===0?a[i]:a[i]*k+x*(1-k);
              out.push(x);
            }
            return out;
          }

          async function candles(symbol){
            const u = `${FUTURES}/fapi/v1/klines?symbol=${symbol}&interval=${TIMEFRAME}&limit=230`;
            const r = await fetch(u);
            if(!r.ok) throw new Error(`${symbol} Binance HTTP ${r.status}`);
            const d = await r.json();
            return d.map(k=>({
              openTime:Number(k[0]), open:Number(k[1]), high:Number(k[2]),
              low:Number(k[3]), close:Number(k[4]), volume:Number(k[5]),
              closeTime:Number(k[6])
            }));
          }

          function analyze(symbol,c){
            const closed=c.filter(x=>x.closeTime<Date.now()-500).slice(-220);
            if(closed.length<200) return null;

            const last=closed.at(-1);
            const cl=closed.map(x=>x.close);
            const close=last.close;
            const e9=ema(cl,9).at(-1)||close;
            const e50=ema(cl,50).at(-1)||close;
            const e200=ema(cl,200).at(-1)||close;

            const direction=close>e9?'LONG':'SHORT';
            let confidence=Math.min(88,Math.max(51,
              Math.round(55+Math.abs(close-e9)/Math.max(close,1)*5000)
            ));

            const aligned = direction==='LONG'
              ? (close>e9 && e9>e50 && e50>e200)
              : (close<e9 && e9<e50 && e50<e200);

            if(!aligned) confidence=Math.max(51,confidence-8);

            const recent=closed.slice(-20);
            let atr=recent.reduce((z,x)=>z+(x.high-x.low),0)/Math.max(1,recent.length);
            atr=Math.max(atr,close*0.0004);

            const stop = direction==='LONG' ? close-atr*1.4 : close+atr*1.4;
            const tp1  = direction==='LONG' ? close+atr*1.8 : close-atr*1.8;
            const tp2  = direction==='LONG' ? close+atr*2.8 : close-atr*2.8;
            const tp3  = direction==='LONG' ? close+atr*4.0 : close-atr*4.0;

            return {
              symbol,
              market:'futures',
              timeframe:TIMEFRAME,
              price:close,
              direction,
              confidence,
              entry:close,
              stop,tp1,tp2,tp3,
              ema9:e9,ema50:e50,ema200:e200,
              candleCloseTime:last.closeTime
            };
          }

          function cleanCommentary(s){
            return String(s||'')
              .replace(/\*\*/g,'')
              .replace(/^#{1,6}\s*/gm,'')
              .replace(/`{1,3}/g,'')
              .split(/\r?\n/)
              .map(x=>x.trim())
              .filter(x=>x && !/^(giriş|entry|stop|tp\s*1|tp\s*2|tp\s*3|hedef\s*1|hedef\s*2|hedef\s*3)\s*[:：-]/i.test(x))
              .join(' ')
              .replace(/\s{2,}/g,' ')
              .trim();
          }

          async function ai(setup){
            const r = await fetch(`${BASE}/api/ai`,{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify(setup)
            });
            if(!r.ok) throw new Error(`AI HTTP ${r.status}`);
            const j=await r.json();
            return {
              provider:j.provider||'Gemini',
              commentary:cleanCommentary(j.commentary)
            };
          }

          async function telegram(setup, commentary, provider, rr){
            const r=await fetch(`${BASE}/api/telegram`,{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({
                setup,
                commentary,
                provider,
                riskReward:rr,
                mode:'github-auto'
              })
            });
            const j=await r.json().catch(()=>({}));
            if(!r.ok || !j.ok) throw new Error(j.error||`Telegram HTTP ${r.status}`);
            return j;
          }

          let sent=0;
          console.log(`SAOMI tarama basladi: ${new Date().toISOString()}`);

          for(const symbol of SYMBOLS){
            try{
              const setup=analyze(symbol,await candles(symbol));
              if(!setup){
                console.log(symbol,'veri yetersiz');
                continue;
              }

              const risk=Math.abs(setup.entry-setup.stop);
              const reward=Math.abs(setup.tp3-setup.entry);
              const rr=risk>0?reward/risk:0;

              console.log(symbol,{
                direction:setup.direction,
                confidence:setup.confidence,
                rr:Number(rr.toFixed(2))
              });

              if(setup.confidence<MIN_CONFIDENCE || rr<MIN_RR){
                continue;
              }

              if(sent>=MAX_SIGNALS){
                console.log('Bu tur icin maksimum sinyal sayisina ulasildi.');
                break;
              }

              const g=await ai(setup);
              const t=await telegram(setup,g.commentary,g.provider,rr);
              sent++;
              console.log(`GONDERILDI ${symbol}`,t);
            }catch(e){
              console.error(`HATA ${symbol}:`,e?.message||e);
            }
          }

          console.log(`SAOMI tarama bitti. Telegram sinyali: ${sent}`);
          NODE

          node /tmp/saomi-scan.mjs